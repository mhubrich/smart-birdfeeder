# Motion Detection
MOTION_VERIFICATION_FRAMES: 1 # Consecutive frames of motion needed before triggering AI
MOTION_DETECTION_ROI: [0, 22, 86, 86] # Region of interest: [ymin, xmin, ymax, xmax] in %
MOTION_THRESHOLD: 50 # Sensitivity for motion detection
MOTION_CHECK_INTERVAL_MS: 1000 # Milliseconds between checking for motion
MOTION_ANALYSIS_WIDTH: 480 # Downsampled width used for motion calculation
DEEP_MONITORING_INTERVAL_MS: 2000 # Polling frequency during inactive periods
DEEP_MONITORING_THRESHOLD_MINUTES: 10 # Minutes of inactivity before entering deep monitoring
MIN_AREA_PIXELS: 5000 # Pixel count threshold for movement to be considered significant
CAMERA_FPS_FALLBACK: 25 # FPS used if stream metadata is unavailable
SIGHTING_COOLDOWN_MINUTES: 1.5 # Minutes to wait before logging another sighting of the same bird
ANALYSIS_COOLDOWN_SECONDS: 10 # Seconds between image analysis requests

# Storage
MAX_DISK_USAGE_PERCENT: 90 # Maximum drive capacity to use before deleting old footage
VIDEO_DURATION_SECONDS: 30 # Length of HQ video clips recorded during sightings
CLEANUP_INTERVAL_HOURS: 24 # How often the system checks for and removes old files

# Vision Advanced
MOG2_HISTORY: 20 # Number of frames used to maintain the background model
MOTION_THRESHOLD_BINARY: 244 # Binary threshold for converting motion delta to mask
CROP_PADDING: 50 # Extra margin (px) around detected motion when cropping for AI
SNAPSHOT_QUALITY: 2 # Quality setting for saved images (1: High, 2: Med, 3: Low)


# System Health
HEARTBEAT_INTERVAL_SECONDS: 600 # How often the vision service sends a heartbeat
HEARTBEAT_THRESHOLD_SECONDS: 1200 # Seconds without heartbeat before considering vision "Offline"
